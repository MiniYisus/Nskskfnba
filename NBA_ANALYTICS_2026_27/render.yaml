services:
  - type: web
    name: nba-analytics-2026-27
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    disk:
      name: nba-data
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: NBA_DB_PATH
        value: /var/data/nba_analytics.db
      - key: NBA_SEASON
        value: 2026-27
      - key: NBA_WEB_USER
        sync: false
      - key: NBA_WEB_PASSWORD
        sync: false
